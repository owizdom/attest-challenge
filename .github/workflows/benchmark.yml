name: benchmark

# workflow_dispatch is what Yukon uses: it opens a PR as the public record and
# then dispatches this workflow on the submission branch. The author guide warns
# against a `pull_request` trigger for exactly that reason — it double-runs every
# submission — so there isn't one.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  actions: read

# One run at a time. Each run pulls ~14 GB of models, and two of them racing on
# a runner with ~14 GB free killed the machine mid-pull with no step logs.
concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The integrity gates need no models and finish in seconds, so they run as
  # their own job. If the sandbox regresses, that must be visible immediately
  # and independently of whether a 14 GB model pull succeeded.
  integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Not optional: harness/evaluate.py refuses to publish a score from an
      # unconfined run, and the Linux path is the one that actually scores.
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      # GitHub's Ubuntu images set kernel.apparmor_restrict_unprivileged_userns=1,
      # which lets bubblewrap create the namespace but then refuses the loopback
      # setup inside it — `bwrap: loopback: Failed RTM_NEWADDR: Operation not
      # permitted`, which is fatal and took down every sandboxed phase. Relaxing
      # it on the runner is the documented fix and costs nothing here: the
      # runner is ephemeral and exists to run this one job.
      - name: Allow unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --unshare-all --die-with-parent --ro-bind /usr /usr \
                --ro-bind-try /lib /lib --ro-bind-try /lib64 /lib64 \
                --proc /proc --dev /dev /usr/bin/env true \
            && echo "bwrap namespace + loopback OK" \
            || { echo "::error::bubblewrap cannot start; the Linux sandbox is the scoring path"; exit 1; }

      # The exploits that once scored 100.00 on the held-out split without
      # reading a single transcript. None of them need a model.
      - name: Sandbox regression tests
        run: python3 tools/attacks.py

  score:
    # Dispatch only. Yukon dispatches this on each submission branch; a plain
    # push to main is usually a promotion of a commit that was already scored,
    # and re-running would spend another hour of model inference to reproduce a
    # number Yukon already has.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ubuntu-latest ships with ~14 GB free and the corpus is ~14 GB, so the
      # pull kills the runner. These three directories are worth ~25 GB and
      # nothing here uses them.
      - name: Reclaim disk
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
                      /usr/local/share/boost /usr/share/swift || true
          sudo docker image prune -af || true
          echo "after reclaim:"
          df -h /

      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      # GitHub's Ubuntu images set kernel.apparmor_restrict_unprivileged_userns=1,
      # which lets bubblewrap create the namespace but then refuses the loopback
      # setup inside it — `bwrap: loopback: Failed RTM_NEWADDR: Operation not
      # permitted`, which is fatal and took down every sandboxed phase. Relaxing
      # it on the runner is the documented fix and costs nothing here: the
      # runner is ephemeral and exists to run this one job.
      - name: Allow unprivileged user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --unshare-all --die-with-parent --ro-bind /usr /usr \
                --ro-bind-try /lib /lib --ro-bind-try /lib64 /lib64 \
                --proc /proc --dev /dev /usr/bin/env true \
            && echo "bwrap namespace + loopback OK" \
            || { echo "::error::bubblewrap cannot start; the Linux sandbox is the scoring path"; exit 1; }

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          ollama serve &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags >/dev/null && exit 0
            sleep 2
          done
          echo "ollama did not come up" >&2; exit 1

      # The models ARE the corpus. Cached because pulling ~14 GB every run
      # would dominate the runtime.
      #
      # NOTE: transcripts are deliberately NOT cached. The cache holds plaintext
      # model outputs, and outputs are deterministic in (model, prompt, seed) —
      # so anyone who can restore it can regenerate the five pinned tags
      # locally, byte-match, and recover which (model, seed) tuples the held-out
      # corpus used. Salting the filename does not hide the contents.
      - name: Cache model blobs
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ hashFiles('harness/corpus.py') }}

      - name: Setup
        run: ./setup.sh

      # The corpus is written to a FILE in its own step, so it is never in the
      # environment of the process that spawns the detector. On macOS a
      # sandboxed child can read its parent's environment; this keeps the same
      # invariant on every platform.
      - name: Materialise the held-out corpus
        id: heldout
        env:
          HELDOUT_B64: ${{ secrets.ATTEST_HELDOUT_B64 }}
        run: |
          if [ -z "${HELDOUT_B64:-}" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No held-out corpus (fork PR or missing secret)."
          else
            mkdir -p "$HOME/.attest-challenge"
            printf '%s' "$HELDOUT_B64" | base64 -d > "$HOME/.attest-challenge/corpus-heldout.json"
            chmod 600 "$HOME/.attest-challenge/corpus-heldout.json"
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # Before the benchmark, because a rejected run exits non-zero — which
      # would otherwise skip this exactly when the shipped baseline is scored.
      - name: Benchmark soundness
        run: |
          if [ "${{ steps.heldout.outputs.present }}" = "true" ]; then
            export ATTEST_HELDOUT="$HOME/.attest-challenge/corpus-heldout.json"
          fi
          python3 tools/verify.py

      - name: Benchmark
        run: |
          if [ "${{ steps.heldout.outputs.present }}" != "true" ]; then
            echo "::error::No held-out corpus available. A dev-split score is not a" \
                 "benchmark result — the dev labels ship in this repository."
            ./benchmark.sh --split dev || true
            exit 1
          fi
          ATTEST_HELDOUT="$HOME/.attest-challenge/corpus-heldout.json" ./benchmark.sh

      # Yukon downloads this and reads `scorePath` out of it. decisions.json is
      # NOT uploaded: it is one row per pair in seed-shuffled order, and
      # publishing it alongside the printed seed let the base ordering be
      # recovered.
      - name: Upload score
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-score
          path: score.json
          if-no-files-found: error
